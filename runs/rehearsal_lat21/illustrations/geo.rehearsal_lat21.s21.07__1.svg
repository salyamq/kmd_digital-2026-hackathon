<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 298" role="img" aria-label="В породе / В журнале бурения" class="ill-svg"><title>В породе / В журнале бурения</title><style>
.ill-bg{fill:var(--ill-bg,#fff)} .ill-box{fill:var(--ill-box,#f3f5f8);stroke:var(--ill-line,#5b6573);stroke-width:1.5}
.ill-good{fill:var(--ill-good,#d9efe1);stroke:var(--ill-good-line,#2f7d4f)} .ill-bad{fill:var(--ill-bad,#f8dcd8);stroke:var(--ill-bad-line,#b5473a)}
.ill-neutral{fill:var(--ill-neutral,#e6e9ef);stroke:var(--ill-line,#5b6573)} .ill-accent{fill:var(--ill-accent,#dce8f8);stroke:var(--ill-accent-line,#2f5f9e)}
.ill-line{stroke:var(--ill-line,#5b6573);stroke-width:1.5;fill:none} .ill-arrow{fill:var(--ill-line,#5b6573)}
.ill-text{fill:var(--ill-text,#1d2330);font:15px system-ui,sans-serif} .ill-small{fill:var(--ill-muted,#5b6573);font:13px system-ui,sans-serif}
.ill-title{fill:var(--ill-text,#1d2330);font:600 16px system-ui,sans-serif} .ill-label{fill:var(--ill-muted,#5b6573);font:italic 12px system-ui,sans-serif}
.ill-point{fill:var(--ill-accent-line,#2f5f9e)}
</style><rect class="ill-bg" x="0" y="0" width="360" height="298" rx="8"/><rect class="ill-box ill-neutral" x="12" y="30" width="336" height="118" rx="10"/><text class="ill-title" x="180.0" y="54" text-anchor="middle"><tspan x="180.0" dy="0">В породе</tspan></text><text class="ill-text" x="26" y="79" text-anchor="start"><tspan x="26" dy="0">• Каверны повышают ёмкость</tspan></text><text class="ill-text" x="26" y="102" text-anchor="start"><tspan x="26" dy="0">• Трещины и каверны дают вторичную</tspan><tspan x="26" dy="19">пористость</tspan></text><rect class="ill-box ill-accent" x="12" y="158" width="336" height="122" rx="10"/><text class="ill-title" x="180.0" y="182" text-anchor="middle"><tspan x="180.0" dy="0">В журнале бурения</tspan></text><text class="ill-text" x="26" y="207" text-anchor="start"><tspan x="26" dy="0">• Сильное поглощение раствора</tspan></text><text class="ill-text" x="26" y="230" text-anchor="start"><tspan x="26" dy="0">• Ускорение проходки</tspan></text><text class="ill-text" x="26" y="253" text-anchor="start"><tspan x="26" dy="0">• В карсте — возможный провал</tspan></text><text class="ill-label" x="350" y="16" text-anchor="end">схема</text></svg>