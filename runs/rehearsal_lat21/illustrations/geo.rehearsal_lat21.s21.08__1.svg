<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 369" role="img" aria-label="Сравнить кривые на одной глубине" class="ill-svg"><title>Сравнить кривые на одной глубине</title><style>
.ill-bg{fill:var(--ill-bg,#fff)} .ill-box{fill:var(--ill-box,#f3f5f8);stroke:var(--ill-line,#5b6573);stroke-width:1.5}
