<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 412" role="img" aria-label="Четыре группы рифовых ловушек" class="ill-svg"><title>Четыре группы рифовых ловушек</title><style>
.ill-bg{fill:var(--ill-bg,#fff)} .ill-box{fill:var(--ill-box,#f3f5f8);stroke:var(--ill-line,#5b6573);stroke-width:1.5}
.ill-good{fill:var(--ill-good,#d9efe1);stroke:var(--ill-good-line,#2f7d4f)} .ill-bad{fill:var(--ill-bad,#f8dcd8);stroke:var(--ill-bad-line,#b5473a)}
.ill-neutral{fill:var(--ill-neutral,#e6e9ef);stroke:var(--ill-line,#5b6573)} .ill-accent{fill:var(--ill-accent,#dce8f8);stroke:var(--ill-accent-line,#2f5f9e)}
.ill-line{stroke:var(--ill-line,#5b6573);stroke-width:1.5;fill:none} .ill-arrow{fill:var(--ill-line,#5b6573)}
.ill-text{fill:var(--ill-text,#1d2330);font:15px system-ui,sans-serif} .ill-small{fill:var(--ill-muted,#5b6573);font:13px system-ui,sans-serif}
.ill-title{fill:var(--ill-text,#1d2330);font:600 16px system-ui,sans-serif} .ill-label{fill:var(--ill-muted,#5b6573);font:italic 12px system-ui,sans-serif}
.ill-point{fill:var(--ill-accent-line,#2f5f9e)}
</style><rect class="ill-bg" x="0" y="0" width="360" height="412" rx="8"/><text class="ill-title" x="180.0" y="38" text-anchor="middle"><tspan x="180.0" dy="0">Четыре группы рифовых ловушек</tspan></text><rect class="ill-box ill-neutral" x="12.0" y="63" width="336" height="56" rx="10"/><text class="ill-text" x="180.0" y="87" text-anchor="middle"><tspan x="180.0" dy="0">1. Палеогеоморфологические: только</tspan><tspan x="180.0" dy="19">древний рельеф</tspan></text><line class="ill-line" x1="180.0" y1="121.0" x2="180.0" y2="145.0"/><polygon class="ill-arrow" points="180.0,145.0 176.1,136.9 183.9,136.9"/><rect class="ill-box ill-accent" x="12.0" y="149" width="336" height="56" rx="10"/><text class="ill-text" x="180.0" y="173" text-anchor="middle"><tspan x="180.0" dy="0">2. Литолого-палеогеоморфологические:</tspan><tspan x="180.0" dy="19">рельеф + замещение пород</tspan></text><line class="ill-line" x1="180.0" y1="207.0" x2="180.0" y2="231.0"/><polygon class="ill-arrow" points="180.0,231.0 176.1,222.9 183.9,222.9"/><rect class="ill-box ill-accent" x="12.0" y="235" width="336" height="75" rx="10"/><text class="ill-text" x="180.0" y="259" text-anchor="middle"><tspan x="180.0" dy="0">3.</tspan><tspan x="180.0" dy="19">Структурно-палеогеоморфологические:</tspan><tspan x="180.0" dy="19">рельеф + тектоника</tspan></text><line class="ill-line" x1="180.0" y1="312.0" x2="180.0" y2="336.0"/><polygon class="ill-arrow" points="180.0,336.0 176.1,327.9 183.9,327.9"/><rect class="ill-box ill-good" x="12.0" y="340" width="336" height="56" rx="10"/><text class="ill-text" x="180.0" y="364" text-anchor="middle"><tspan x="180.0" dy="0">4. Структурно-палеогеографические с</tspan><tspan x="180.0" dy="19">литологическим экраном: всё вместе</tspan></text><text class="ill-label" x="350" y="16" text-anchor="end">схема</text></svg>