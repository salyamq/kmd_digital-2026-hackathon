<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 350" role="img" aria-label="Первая и вторая группы: где лучшие породы" class="ill-svg"><title>Первая и вторая группы: где лучшие породы</title><style>
.ill-bg{fill:var(--ill-bg,#fff)} .ill-box{fill:var(--ill-box,#f3f5f8);stroke:var(--ill-line,#5b6573);stroke-width:1.5}
.ill-good{fill:var(--ill-good,#d9efe1);stroke:var(--ill-good-line,#2f7d4f)} .ill-bad{fill:var(--ill-bad,#f8dcd8);stroke:var(--ill-bad-line,#b5473a)}
.ill-neutral{fill:var(--ill-neutral,#e6e9ef);stroke:var(--ill-line,#5b6573)} .ill-accent{fill:var(--ill-accent,#dce8f8);stroke:var(--ill-accent-line,#2f5f9e)}
.ill-line{stroke:var(--ill-line,#5b6573);stroke-width:1.5;fill:none} .ill-arrow{fill:var(--ill-line,#5b6573)}
.ill-text{fill:var(--ill-text,#1d2330);font:15px system-ui,sans-serif} .ill-small{fill:var(--ill-muted,#5b6573);font:13px system-ui,sans-serif}
.ill-title{fill:var(--ill-text,#1d2330);font:600 16px system-ui,sans-serif} .ill-label{fill:var(--ill-muted,#5b6573);font:italic 12px system-ui,sans-serif}
.ill-point{fill:var(--ill-accent-line,#2f5f9e)}
</style><rect class="ill-bg" x="0" y="0" width="360" height="350" rx="8"/><text class="ill-title" x="180.0" y="38" text-anchor="middle"><tspan x="180.0" dy="0">Первая и вторая группы: где лучшие</tspan><tspan x="180.0" dy="19">породы</tspan></text><rect class="ill-box ill-neutral" x="12" y="82" width="336" height="99" rx="10"/><text class="ill-title" x="180.0" y="106" text-anchor="middle"><tspan x="180.0" dy="0">Небольшой купол (1-я группа)</tspan></text><text class="ill-text" x="26" y="131" text-anchor="start"><tspan x="26" dy="0">• лучшие коллекторы в центре</tspan></text><text class="ill-text" x="26" y="154" text-anchor="start"><tspan x="26" dy="0">• простой резервуар</tspan></text><rect class="ill-box ill-good" x="12" y="191" width="336" height="141" rx="10"/><text class="ill-title" x="180.0" y="215" text-anchor="middle"><tspan x="180.0" dy="0">Крупный столовый риф или атолл</tspan><tspan x="180.0" dy="19">(2-я группа)</tspan></text><text class="ill-text" x="26" y="259" text-anchor="start"><tspan x="26" dy="0">• лучшие коллекторы на краях</tspan></text><text class="ill-text" x="26" y="282" text-anchor="start"><tspan x="26" dy="0">• центр может быть экраном</tspan></text><text class="ill-text" x="26" y="305" text-anchor="start"><tspan x="26" dy="0">• у атолла край ещё и самый высокий</tspan></text><text class="ill-label" x="350" y="16" text-anchor="end">схема</text></svg>