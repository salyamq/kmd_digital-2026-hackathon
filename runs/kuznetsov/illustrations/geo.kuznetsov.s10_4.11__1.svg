<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 556" role="img" aria-label="Предел высоты рифовой залежи" class="ill-svg"><title>Предел высоты рифовой залежи</title><style>
.ill-bg{fill:var(--ill-bg,#fff)} .ill-box{fill:var(--ill-box,#f3f5f8);stroke:var(--ill-line,#5b6573);stroke-width:1.5}
.ill-good{fill:var(--ill-good,#d9efe1);stroke:var(--ill-good-line,#2f7d4f)} .ill-bad{fill:var(--ill-bad,#f8dcd8);stroke:var(--ill-bad-line,#b5473a)}
.ill-neutral{fill:var(--ill-neutral,#e6e9ef);stroke:var(--ill-line,#5b6573)} .ill-accent{fill:var(--ill-accent,#dce8f8);stroke:var(--ill-accent-line,#2f5f9e)}
.ill-line{stroke:var(--ill-line,#5b6573);stroke-width:1.5;fill:none} .ill-arrow{fill:var(--ill-line,#5b6573)}
.ill-text{fill:var(--ill-text,#1d2330);font:15px system-ui,sans-serif} .ill-small{fill:var(--ill-muted,#5b6573);font:13px system-ui,sans-serif}
.ill-title{fill:var(--ill-text,#1d2330);font:600 16px system-ui,sans-serif} .ill-label{fill:var(--ill-muted,#5b6573);font:italic 12px system-ui,sans-serif}
.ill-point{fill:var(--ill-accent-line,#2f5f9e)}
</style><rect class="ill-bg" x="0" y="0" width="360" height="556" rx="8"/><text class="ill-title" x="180.0" y="38" text-anchor="middle"><tspan x="180.0" dy="0">Предел высоты рифовой залежи</tspan></text><text class="ill-small" x="14" y="67">Признаки</text><rect class="ill-box ill-accent" x="12" y="75" width="336" height="33" rx="8"/><text class="ill-text" x="24" y="96" text-anchor="start"><tspan x="24" dy="0">Тип рифа</tspan></text><rect class="ill-box ill-accent" x="12" y="114" width="336" height="52" rx="8"/><text class="ill-text" x="24" y="135" text-anchor="start"><tspan x="24" dy="0">Есть ли непроницаемые внерифовые или</tspan><tspan x="24" dy="19">зарифовые породы</tspan></text><rect class="ill-box ill-accent" x="12" y="172" width="336" height="33" rx="8"/><text class="ill-text" x="24" y="193" text-anchor="start"><tspan x="24" dy="0">Было ли позднее поднятие</tspan></text><line class="ill-line" x1="180.0" y1="213.0" x2="180.0" y2="233.0"/><polygon class="ill-arrow" points="180.0,233.0 176.1,224.9 183.9,224.9"/><text class="ill-small" x="14" y="245">Правило</text><rect class="ill-box ill-neutral" x="12" y="253" width="336" height="52" rx="8"/><text class="ill-text" x="24" y="274" text-anchor="start"><tspan x="24" dy="0">Предел высоты задаёт способ замыкания</tspan><tspan x="24" dy="19">ловушки</tspan></text><line class="ill-line" x1="180.0" y1="311.0" x2="180.0" y2="331.0"/><polygon class="ill-arrow" points="180.0,331.0 176.1,322.9 183.9,322.9"/><text class="ill-small" x="14" y="343">Вывод</text><rect class="ill-box ill-neutral" x="12" y="351" width="336" height="52" rx="8"/><text class="ill-text" x="24" y="372" text-anchor="start"><tspan x="24" dy="0">только рельеф → ≈ превышение рифа над</tspan><tspan x="24" dy="19">окружением</tspan></text><rect class="ill-box ill-good" x="12" y="409" width="336" height="71" rx="8"/><text class="ill-text" x="24" y="430" text-anchor="start"><tspan x="24" dy="0">боковой экран (в т. ч. лагунные</tspan><tspan x="24" dy="19">сульфаты и доломиты) → до почти полной</tspan><tspan x="24" dy="19">мощности рифа; висячие залежи</tspan></text><rect class="ill-box ill-accent" x="12" y="486" width="336" height="52" rx="8"/><text class="ill-text" x="24" y="507" text-anchor="start"><tspan x="24" dy="0">позднее поднятие → амплитуда и высота</tspan><tspan x="24" dy="19">залежи растут</tspan></text><text class="ill-label" x="350" y="16" text-anchor="end">схема</text></svg>