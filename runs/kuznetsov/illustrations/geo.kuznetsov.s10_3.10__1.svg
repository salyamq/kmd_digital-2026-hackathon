<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 460" role="img" aria-label="Сначала легенда, потом контуры" class="ill-svg"><title>Сначала легенда, потом контуры</title><style>
.ill-bg{fill:var(--ill-bg,#fff)} .ill-box{fill:var(--ill-box,#f3f5f8);stroke:var(--ill-line,#5b6573);stroke-width:1.5}
.ill-good{fill:var(--ill-good,#d9efe1);stroke:var(--ill-good-line,#2f7d4f)} .ill-bad{fill:var(--ill-bad,#f8dcd8);stroke:var(--ill-bad-line,#b5473a)}
.ill-neutral{fill:var(--ill-neutral,#e6e9ef);stroke:var(--ill-line,#5b6573)} .ill-accent{fill:var(--ill-accent,#dce8f8);stroke:var(--ill-accent-line,#2f5f9e)}
.ill-line{stroke:var(--ill-line,#5b6573);stroke-width:1.5;fill:none} .ill-arrow{fill:var(--ill-line,#5b6573)}
.ill-text{fill:var(--ill-text,#1d2330);font:15px system-ui,sans-serif} .ill-small{fill:var(--ill-muted,#5b6573);font:13px system-ui,sans-serif}
.ill-title{fill:var(--ill-text,#1d2330);font:600 16px system-ui,sans-serif} .ill-label{fill:var(--ill-muted,#5b6573);font:italic 12px system-ui,sans-serif}
.ill-point{fill:var(--ill-accent-line,#2f5f9e)}
</style><rect class="ill-bg" x="0" y="0" width="360" height="460" rx="8"/><text class="ill-title" x="180.0" y="38" text-anchor="middle"><tspan x="180.0" dy="0">Сначала легенда, потом контуры</tspan></text><text class="ill-small" x="14" y="67">Признаки</text><rect class="ill-box ill-accent" x="12" y="75" width="336" height="33" rx="8"/><text class="ill-text" x="24" y="96" text-anchor="start"><tspan x="24" dy="0">Линия или значок на рис. 10.4</tspan></text><line class="ill-line" x1="180.0" y1="116.0" x2="180.0" y2="136.0"/><polygon class="ill-arrow" points="180.0,136.0 176.1,127.9 183.9,127.9"/><text class="ill-small" x="14" y="148">Правило</text><rect class="ill-box ill-neutral" x="12" y="156" width="336" height="52" rx="8"/><text class="ill-text" x="24" y="177" text-anchor="start"><tspan x="24" dy="0">Определить по легенде, какую величину</tspan><tspan x="24" dy="19">показывает линия</tspan></text><line class="ill-line" x1="180.0" y1="214.0" x2="180.0" y2="234.0"/><polygon class="ill-arrow" points="180.0,234.0 176.1,225.9 183.9,225.9"/><text class="ill-small" x="14" y="246">Вывод</text><rect class="ill-box ill-accent" x="12" y="254" width="336" height="33" rx="8"/><text class="ill-text" x="24" y="275" text-anchor="start"><tspan x="24" dy="0">равная отметка кровли → изогипса</tspan></text><rect class="ill-box ill-good" x="12" y="293" width="336" height="52" rx="8"/><text class="ill-text" x="24" y="314" text-anchor="start"><tspan x="24" dy="0">равный коэффициент пористости →</tspan><tspan x="24" dy="19">изолиния пористости</tspan></text><rect class="ill-box ill-neutral" x="12" y="351" width="336" height="52" rx="8"/><text class="ill-text" x="24" y="372" text-anchor="start"><tspan x="24" dy="0">скважина с числом → замер пористости в</tspan><tspan x="24" dy="19">точке</tspan></text><rect class="ill-box ill-bad" x="12" y="409" width="336" height="33" rx="8"/><text class="ill-text" x="24" y="430" text-anchor="start"><tspan x="24" dy="0">линия разлома → предполагаемый разлом</tspan></text><text class="ill-label" x="350" y="16" text-anchor="end">схема</text></svg>