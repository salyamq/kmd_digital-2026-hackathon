<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" role="img" aria-label="С чего начать бурение рифа второй группы" class="ill-svg"><title>С чего начать бурение рифа второй группы</title><style>
.ill-bg{fill:var(--ill-bg,#fff)} .ill-box{fill:var(--ill-box,#f3f5f8);stroke:var(--ill-line,#5b6573);stroke-width:1.5}
.ill-good{fill:var(--ill-good,#d9efe1);stroke:var(--ill-good-line,#2f7d4f)} .ill-bad{fill:var(--ill-bad,#f8dcd8);stroke:var(--ill-bad-line,#b5473a)}
.ill-neutral{fill:var(--ill-neutral,#e6e9ef);stroke:var(--ill-line,#5b6573)} .ill-accent{fill:var(--ill-accent,#dce8f8);stroke:var(--ill-accent-line,#2f5f9e)}
.ill-line{stroke:var(--ill-line,#5b6573);stroke-width:1.5;fill:none} .ill-arrow{fill:var(--ill-line,#5b6573)}
.ill-text{fill:var(--ill-text,#1d2330);font:15px system-ui,sans-serif} .ill-small{fill:var(--ill-muted,#5b6573);font:13px system-ui,sans-serif}
.ill-title{fill:var(--ill-text,#1d2330);font:600 16px system-ui,sans-serif} .ill-label{fill:var(--ill-muted,#5b6573);font:italic 12px system-ui,sans-serif}
.ill-point{fill:var(--ill-accent-line,#2f5f9e)}
</style><rect class="ill-bg" x="0" y="0" width="360" height="420" rx="8"/><text class="ill-title" x="180.0" y="38" text-anchor="middle"><tspan x="180.0" dy="0">С чего начать бурение рифа второй</tspan><tspan x="180.0" dy="19">группы</tspan></text><text class="ill-small" x="14" y="86">Признаки</text><rect class="ill-box ill-accent" x="12" y="94" width="336" height="52" rx="8"/><text class="ill-text" x="24" y="115" text-anchor="start"><tspan x="24" dy="0">Геологические и геофизические данные о</tspan><tspan x="24" dy="19">форме рифа</tspan></text><line class="ill-line" x1="180.0" y1="154.0" x2="180.0" y2="174.0"/><polygon class="ill-arrow" points="180.0,174.0 176.1,165.9 183.9,165.9"/><text class="ill-small" x="14" y="186">Правило</text><rect class="ill-box ill-neutral" x="12" y="194" width="336" height="52" rx="8"/><text class="ill-text" x="24" y="215" text-anchor="start"><tspan x="24" dy="0">Крупный плосковершинный или</tspan><tspan x="24" dy="19">атолловидный риф?</tspan></text><line class="ill-line" x1="180.0" y1="252.0" x2="180.0" y2="272.0"/><polygon class="ill-arrow" points="180.0,272.0 176.1,263.9 183.9,263.9"/><text class="ill-small" x="14" y="284">Вывод</text><rect class="ill-box ill-good" x="12" y="292" width="336" height="52" rx="8"/><text class="ill-text" x="24" y="313" text-anchor="start"><tspan x="24" dy="0">да → первые скважины по периферии,</tspan><tspan x="24" dy="19">центр — второй этап</tspan></text><rect class="ill-box ill-accent" x="12" y="350" width="336" height="52" rx="8"/><text class="ill-text" x="24" y="371" text-anchor="start"><tspan x="24" dy="0">начали с центра → добавить оценочные</tspan><tspan x="24" dy="19">скважины по периферии</tspan></text><text class="ill-label" x="350" y="16" text-anchor="end">схема</text></svg>