<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 354" role="img" aria-label="Высота ловушки в двух случаях" class="ill-svg"><title>Высота ловушки в двух случаях</title><style>
.ill-bg{fill:var(--ill-bg,#fff)} .ill-box{fill:var(--ill-box,#f3f5f8);stroke:var(--ill-line,#5b6573);stroke-width:1.5}
.ill-good{fill:var(--ill-good,#d9efe1);stroke:var(--ill-good-line,#2f7d4f)} .ill-bad{fill:var(--ill-bad,#f8dcd8);stroke:var(--ill-bad-line,#b5473a)}
.ill-neutral{fill:var(--ill-neutral,#e6e9ef);stroke:var(--ill-line,#5b6573)} .ill-accent{fill:var(--ill-accent,#dce8f8);stroke:var(--ill-accent-line,#2f5f9e)}
.ill-line{stroke:var(--ill-line,#5b6573);stroke-width:1.5;fill:none} .ill-arrow{fill:var(--ill-line,#5b6573)}
.ill-text{fill:var(--ill-text,#1d2330);font:15px system-ui,sans-serif} .ill-small{fill:var(--ill-muted,#5b6573);font:13px system-ui,sans-serif}
.ill-title{fill:var(--ill-text,#1d2330);font:600 16px system-ui,sans-serif} .ill-label{fill:var(--ill-muted,#5b6573);font:italic 12px system-ui,sans-serif}
.ill-point{fill:var(--ill-accent-line,#2f5f9e)}
</style><rect class="ill-bg" x="0" y="0" width="360" height="354" rx="8"/><text class="ill-title" x="180.0" y="38" text-anchor="middle"><tspan x="180.0" dy="0">Высота ловушки в двух случаях</tspan></text><rect class="ill-box ill-neutral" x="12" y="63" width="336" height="122" rx="10"/><text class="ill-title" x="180.0" y="87" text-anchor="middle"><tspan x="180.0" dy="0">Внерифовые породы проницаемы</tspan></text><text class="ill-text" x="26" y="112" text-anchor="start"><tspan x="26" dy="0">• высота = превышение рифа над ними</tspan></text><text class="ill-text" x="26" y="135" text-anchor="start"><tspan x="26" dy="0">• ниже — открытая часть рифа</tspan></text><text class="ill-text" x="26" y="158" text-anchor="start"><tspan x="26" dy="0">• палеогеоморфологическая ловушка</tspan></text><rect class="ill-box ill-good" x="12" y="195" width="336" height="141" rx="10"/><text class="ill-title" x="180.0" y="219" text-anchor="middle"><tspan x="180.0" dy="0">Внерифовые породы непроницаемы</tspan></text><text class="ill-text" x="26" y="244" text-anchor="start"><tspan x="26" dy="0">• высота + мощность экранирующих пород</tspan></text><text class="ill-text" x="26" y="267" text-anchor="start"><tspan x="26" dy="0">• ниже экрана — открытая часть</tspan></text><text class="ill-text" x="26" y="290" text-anchor="start"><tspan x="26" dy="0">• литолого-палеогеоморфологическая</tspan><tspan x="26" dy="19">ловушка</tspan></text><text class="ill-label" x="350" y="16" text-anchor="end">схема</text></svg>