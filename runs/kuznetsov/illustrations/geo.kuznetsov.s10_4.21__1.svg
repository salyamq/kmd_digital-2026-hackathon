<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 518" role="img" aria-label="Форма рифа → схема разведки" class="ill-svg"><title>Форма рифа → схема разведки</title><style>
.ill-bg{fill:var(--ill-bg,#fff)} .ill-box{fill:var(--ill-box,#f3f5f8);stroke:var(--ill-line,#5b6573);stroke-width:1.5}
.ill-good{fill:var(--ill-good,#d9efe1);stroke:var(--ill-good-line,#2f7d4f)} .ill-bad{fill:var(--ill-bad,#f8dcd8);stroke:var(--ill-bad-line,#b5473a)}
.ill-neutral{fill:var(--ill-neutral,#e6e9ef);stroke:var(--ill-line,#5b6573)} .ill-accent{fill:var(--ill-accent,#dce8f8);stroke:var(--ill-accent-line,#2f5f9e)}
.ill-line{stroke:var(--ill-line,#5b6573);stroke-width:1.5;fill:none} .ill-arrow{fill:var(--ill-line,#5b6573)}
.ill-text{fill:var(--ill-text,#1d2330);font:15px system-ui,sans-serif} .ill-small{fill:var(--ill-muted,#5b6573);font:13px system-ui,sans-serif}
.ill-title{fill:var(--ill-text,#1d2330);font:600 16px system-ui,sans-serif} .ill-label{fill:var(--ill-muted,#5b6573);font:italic 12px system-ui,sans-serif}
.ill-point{fill:var(--ill-accent-line,#2f5f9e)}
</style><rect class="ill-bg" x="0" y="0" width="360" height="518" rx="8"/><text class="ill-title" x="180.0" y="38" text-anchor="middle"><tspan x="180.0" dy="0">Форма рифа → схема разведки</tspan></text><text class="ill-small" x="14" y="67">Признаки</text><rect class="ill-box ill-accent" x="12" y="75" width="336" height="33" rx="8"/><text class="ill-text" x="24" y="96" text-anchor="start"><tspan x="24" dy="0">Форма рифа</tspan></text><rect class="ill-box ill-accent" x="12" y="114" width="336" height="33" rx="8"/><text class="ill-text" x="24" y="135" text-anchor="start"><tspan x="24" dy="0">Зона основных запасов</tspan></text><line class="ill-line" x1="180.0" y1="155.0" x2="180.0" y2="175.0"/><polygon class="ill-arrow" points="180.0,175.0 176.1,166.9 183.9,166.9"/><text class="ill-small" x="14" y="187">Правило</text><rect class="ill-box ill-neutral" x="12" y="195" width="336" height="33" rx="8"/><text class="ill-text" x="24" y="216" text-anchor="start"><tspan x="24" dy="0">Привязать схему к геометрии и запасам</tspan></text><line class="ill-line" x1="180.0" y1="234.0" x2="180.0" y2="254.0"/><polygon class="ill-arrow" points="180.0,254.0 176.1,245.9 183.9,245.9"/><text class="ill-small" x="14" y="266">Вывод</text><rect class="ill-box ill-neutral" x="12" y="274" width="336" height="52" rx="8"/><text class="ill-text" x="24" y="295" text-anchor="start"><tspan x="24" dy="0">небольшой купол → куст стволов,</tspan><tspan x="24" dy="19">отклонения 400–500 м, до 1 км²</tspan></text><rect class="ill-box ill-accent" x="12" y="332" width="336" height="52" rx="8"/><text class="ill-text" x="24" y="353" text-anchor="start"><tspan x="24" dy="0">вытянутая подкова → ряд многоствольных</tspan><tspan x="24" dy="19">скважин по оси</tspan></text><rect class="ill-box ill-good" x="12" y="390" width="336" height="52" rx="8"/><text class="ill-text" x="24" y="411" text-anchor="start"><tspan x="24" dy="0">вторая группа (столовый, атолл) →</tspan><tspan x="24" dy="19">кольцо по периферии</tspan></text><rect class="ill-box ill-accent" x="12" y="448" width="336" height="52" rx="8"/><text class="ill-text" x="24" y="469" text-anchor="start"><tspan x="24" dy="0">асимметричный риф → профили, сгущение</tspan><tspan x="24" dy="19">к гребню и фронту</tspan></text><text class="ill-label" x="350" y="16" text-anchor="end">схема</text></svg>