</style><rect class="ill-bg" x="0" y="0" width="360" height="304" rx="8"/><rect class="ill-box ill-good" x="12" y="30" width="336" height="118" rx="10"/><text class="ill-title" x="180.0" y="54" text-anchor="middle"><tspan x="180.0" dy="0">Газ из породы</tspan></text><text class="ill-text" x="26" y="79" text-anchor="start"><tspan x="26" dy="0">• Запас противодавления</tspan></text><text class="ill-text" x="26" y="102" text-anchor="start"><tspan x="26" dy="0">• После остановки бурения газ</tspan><tspan x="26" dy="19">прекращает поступать</tspan></text><rect class="ill-box ill-bad" x="12" y="158" width="336" height="99" rx="10"/><text class="ill-title" x="180.0" y="182" text-anchor="middle"><tspan x="180.0" dy="0">Переходная зона</tspan></text><text class="ill-text" x="26" y="207" text-anchor="start"><tspan x="26" dy="0">• Рост газосодержания</tspan></text><text class="ill-text" x="26" y="230" text-anchor="start"><tspan x="26" dy="0">• Риск локального скопления газа</tspan></text><text class="ill-small" x="180.0" y="279" text-anchor="middle"><tspan x="180.0" dy="0">Общий сигнал имеет разные источники.</tspan></text><text class="ill-label" x="350" y="16" text-anchor="end">схема</text></svg>