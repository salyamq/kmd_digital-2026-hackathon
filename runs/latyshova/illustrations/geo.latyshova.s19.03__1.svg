<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 434" role="img" aria-label="Сколько методов нужно для разреза" class="ill-svg"><title>Сколько методов нужно для разреза</title><style>
.ill-bg{fill:var(--ill-bg,#fff)} .ill-box{fill:var(--ill-box,#f3f5f8);stroke:var(--ill-line,#5b6573);stroke-width:1.5}
.ill-good{fill:var(--ill-good,#d9efe1);stroke:var(--ill-good-line,#2f7d4f)} .ill-bad{fill:var(--ill-bad,#f8dcd8);stroke:var(--ill-bad-line,#b5473a)}
.ill-neutral{fill:var(--ill-neutral,#e6e9ef);stroke:var(--ill-line,#5b6573)} .ill-accent{fill:var(--ill-accent,#dce8f8);stroke:var(--ill-accent-line,#2f5f9e)}
.ill-line{stroke:var(--ill-line,#5b6573);stroke-width:1.5;fill:none} .ill-arrow{fill:var(--ill-line,#5b6573)}
.ill-text{fill:var(--ill-text,#1d2330);font:15px system-ui,sans-serif} .ill-small{fill:var(--ill-muted,#5b6573);font:13px system-ui,sans-serif}
.ill-title{fill:var(--ill-text,#1d2330);font:600 16px system-ui,sans-serif} .ill-label{fill:var(--ill-muted,#5b6573);font:italic 12px system-ui,sans-serif}
.ill-point{fill:var(--ill-accent-line,#2f5f9e)}
</style><rect class="ill-bg" x="0" y="0" width="360" height="434" rx="8"/><text class="ill-title" x="180.0" y="38" text-anchor="middle"><tspan x="180.0" dy="0">Сколько методов нужно для разреза</tspan></text><rect class="ill-box ill-good" x="12" y="63" width="336" height="160" rx="10"/><text class="ill-title" x="180.0" y="87" text-anchor="middle"><tspan x="180.0" dy="0">Простой разрез</tspan></text><text class="ill-text" x="26" y="112" text-anchor="start"><tspan x="26" dy="0">• породы с ясно выраженными свойствами</tspan></text><text class="ill-text" x="26" y="135" text-anchor="start"><tspan x="26" dy="0">• терригенный, плотные карбонаты</tspan><tspan x="26" dy="19">подчинены</tspan></text><text class="ill-text" x="26" y="177" text-anchor="start"><tspan x="26" dy="0">• хватает немногих методов, даже</tspan><tspan x="26" dy="19">электрических</tspan></text><rect class="ill-box ill-bad" x="12" y="233" width="336" height="183" rx="10"/><text class="ill-title" x="180.0" y="257" text-anchor="middle"><tspan x="180.0" dy="0">Смешанный разрез</tspan></text><text class="ill-text" x="26" y="282" text-anchor="start"><tspan x="26" dy="0">• терригенные и карбонатные породы</tspan></text><text class="ill-text" x="26" y="305" text-anchor="start"><tspan x="26" dy="0">• разные типы пустот</tspan></text><text class="ill-text" x="26" y="328" text-anchor="start"><tspan x="26" dy="0">• вода разной минерализации, нефть,</tspan><tspan x="26" dy="19">газ</tspan></text><text class="ill-text" x="26" y="370" text-anchor="start"><tspan x="26" dy="0">• нужна количественная интерпретация и</tspan><tspan x="26" dy="19">геология</tspan></text><text class="ill-label" x="350" y="16" text-anchor="end">схема</text></svg>