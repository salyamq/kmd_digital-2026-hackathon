<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 345" role="img" aria-label="Водонасыщенность растёт — меняется то, что течёт" class="ill-svg"><title>Водонасыщенность растёт — меняется то, что течёт</title><style>
.ill-bg{fill:var(--ill-bg,#fff)} .ill-box{fill:var(--ill-box,#f3f5f8);stroke:var(--ill-line,#5b6573);stroke-width:1.5}
.ill-good{fill:var(--ill-good,#d9efe1);stroke:var(--ill-good-line,#2f7d4f)} .ill-bad{fill:var(--ill-bad,#f8dcd8);stroke:var(--ill-bad-line,#b5473a)}
.ill-neutral{fill:var(--ill-neutral,#e6e9ef);stroke:var(--ill-line,#5b6573)} .ill-accent{fill:var(--ill-accent,#dce8f8);stroke:var(--ill-accent-line,#2f5f9e)}
.ill-line{stroke:var(--ill-line,#5b6573);stroke-width:1.5;fill:none} .ill-arrow{fill:var(--ill-line,#5b6573)}
.ill-text{fill:var(--ill-text,#1d2330);font:15px system-ui,sans-serif} .ill-small{fill:var(--ill-muted,#5b6573);font:13px system-ui,sans-serif}
.ill-title{fill:var(--ill-text,#1d2330);font:600 16px system-ui,sans-serif} .ill-label{fill:var(--ill-muted,#5b6573);font:italic 12px system-ui,sans-serif}
.ill-point{fill:var(--ill-accent-line,#2f5f9e)}
</style><rect class="ill-bg" x="0" y="0" width="360" height="345" rx="8"/><text class="ill-title" x="180.0" y="38" text-anchor="middle"><tspan x="180.0" dy="0">Водонасыщенность растёт — меняется</tspan><tspan x="180.0" dy="19">то, что течёт</tspan></text><rect class="ill-box ill-good" x="12.0" y="82" width="336" height="75" rx="10"/><text class="ill-text" x="180.0" y="106" text-anchor="middle"><tspan x="180.0" dy="0">От связанной воды до первой</tspan><tspan x="180.0" dy="19">критической: течёт только нефть</tspan><tspan x="180.0" dy="19">(область 1)</tspan></text><line class="ill-line" x1="180.0" y1="159.0" x2="180.0" y2="183.0"/><polygon class="ill-arrow" points="180.0,183.0 176.1,174.9 183.9,174.9"/><rect class="ill-box ill-accent" x="12.0" y="187" width="336" height="56" rx="10"/><text class="ill-text" x="180.0" y="211" text-anchor="middle"><tspan x="180.0" dy="0">Между критическими значениями: нефть</tspan><tspan x="180.0" dy="19">с водой (область 2)</tspan></text><line class="ill-line" x1="180.0" y1="245.0" x2="180.0" y2="269.0"/><polygon class="ill-arrow" points="180.0,269.0 176.1,260.9 183.9,260.9"/><rect class="ill-box ill-bad" x="12.0" y="273" width="336" height="56" rx="10"/><text class="ill-text" x="180.0" y="297" text-anchor="middle"><tspan x="180.0" dy="0">Выше второй критической: течёт</tspan><tspan x="180.0" dy="19">только вода (область 3)</tspan></text><text class="ill-label" x="350" y="16" text-anchor="end">схема</text></svg>