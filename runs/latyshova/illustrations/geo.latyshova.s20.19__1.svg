<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 478" role="img" aria-label="Нормализация: признаки → правило → вывод" class="ill-svg"><title>Нормализация: признаки → правило → вывод</title><style>
.ill-bg{fill:var(--ill-bg,#fff)} .ill-box{fill:var(--ill-box,#f3f5f8);stroke:var(--ill-line,#5b6573);stroke-width:1.5}
.ill-good{fill:var(--ill-good,#d9efe1);stroke:var(--ill-good-line,#2f7d4f)} .ill-bad{fill:var(--ill-bad,#f8dcd8);stroke:var(--ill-bad-line,#b5473a)}
.ill-neutral{fill:var(--ill-neutral,#e6e9ef);stroke:var(--ill-line,#5b6573)} .ill-accent{fill:var(--ill-accent,#dce8f8);stroke:var(--ill-accent-line,#2f5f9e)}
.ill-line{stroke:var(--ill-line,#5b6573);stroke-width:1.5;fill:none} .ill-arrow{fill:var(--ill-line,#5b6573)}
.ill-text{fill:var(--ill-text,#1d2330);font:15px system-ui,sans-serif} .ill-small{fill:var(--ill-muted,#5b6573);font:13px system-ui,sans-serif}
.ill-title{fill:var(--ill-text,#1d2330);font:600 16px system-ui,sans-serif} .ill-label{fill:var(--ill-muted,#5b6573);font:italic 12px system-ui,sans-serif}
.ill-point{fill:var(--ill-accent-line,#2f5f9e)}
</style><rect class="ill-bg" x="0" y="0" width="360" height="478" rx="8"/><text class="ill-title" x="180.0" y="38" text-anchor="middle"><tspan x="180.0" dy="0">Нормализация: признаки → правило →</tspan><tspan x="180.0" dy="19">вывод</tspan></text><text class="ill-small" x="14" y="86">Признаки</text><rect class="ill-box ill-accent" x="12" y="94" width="336" height="33" rx="8"/><text class="ill-text" x="24" y="115" text-anchor="start"><tspan x="24" dy="0">Кривая сопротивления глубинного метода</tspan></text><rect class="ill-box ill-accent" x="12" y="133" width="336" height="52" rx="8"/><text class="ill-text" x="24" y="154" text-anchor="start"><tspan x="24" dy="0">Кривая метода пористости (НМ, АК или</tspan><tspan x="24" dy="19">ГГМ)</tspan></text><line class="ill-line" x1="180.0" y1="193.0" x2="180.0" y2="213.0"/><polygon class="ill-arrow" points="180.0,213.0 176.1,204.9 183.9,204.9"/><text class="ill-small" x="14" y="225">Правило</text><rect class="ill-box ill-neutral" x="12" y="233" width="336" height="52" rx="8"/><text class="ill-text" x="24" y="254" text-anchor="start"><tspan x="24" dy="0">Совместить кривые в неколлекторах и</tspan><tspan x="24" dy="19">водоносных коллекторах</tspan></text><line class="ill-line" x1="180.0" y1="291.0" x2="180.0" y2="311.0"/><polygon class="ill-arrow" points="180.0,311.0 176.1,302.9 183.9,302.9"/><text class="ill-small" x="14" y="323">Вывод</text><rect class="ill-box ill-neutral" x="12" y="331" width="336" height="52" rx="8"/><text class="ill-text" x="24" y="352" text-anchor="start"><tspan x="24" dy="0">кривые совпадают → неколлектор или</tspan><tspan x="24" dy="19">водоносный коллектор</tspan></text><rect class="ill-box ill-good" x="12" y="389" width="336" height="71" rx="8"/><text class="ill-text" x="24" y="410" text-anchor="start"><tspan x="24" dy="0">кривые расходятся → продуктивный</tspan><tspan x="24" dy="19">коллектор (при пресном фильтрате —</tspan><tspan x="24" dy="19">коллектор)</tspan></text><text class="ill-label" x="350" y="16" text-anchor="end">схема</text></svg>