<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 460" role="img" aria-label="Пласт у контакта сверху вниз" class="ill-svg"><title>Пласт у контакта сверху вниз</title><style>
.ill-bg{fill:var(--ill-bg,#fff)} .ill-box{fill:var(--ill-box,#f3f5f8);stroke:var(--ill-line,#5b6573);stroke-width:1.5}
.ill-good{fill:var(--ill-good,#d9efe1);stroke:var(--ill-good-line,#2f7d4f)} .ill-bad{fill:var(--ill-bad,#f8dcd8);stroke:var(--ill-bad-line,#b5473a)}
.ill-neutral{fill:var(--ill-neutral,#e6e9ef);stroke:var(--ill-line,#5b6573)} .ill-accent{fill:var(--ill-accent,#dce8f8);stroke:var(--ill-accent-line,#2f5f9e)}
.ill-line{stroke:var(--ill-line,#5b6573);stroke-width:1.5;fill:none} .ill-arrow{fill:var(--ill-line,#5b6573)}
.ill-text{fill:var(--ill-text,#1d2330);font:15px system-ui,sans-serif} .ill-small{fill:var(--ill-muted,#5b6573);font:13px system-ui,sans-serif}
.ill-title{fill:var(--ill-text,#1d2330);font:600 16px system-ui,sans-serif} .ill-label{fill:var(--ill-muted,#5b6573);font:italic 12px system-ui,sans-serif}
.ill-point{fill:var(--ill-accent-line,#2f5f9e)}
</style><rect class="ill-bg" x="0" y="0" width="360" height="460" rx="8"/><text class="ill-title" x="180.0" y="38" text-anchor="middle"><tspan x="180.0" dy="0">Пласт у контакта сверху вниз</tspan></text><rect class="ill-box ill-neutral" x="12.0" y="63" width="336" height="37" rx="10"/><text class="ill-text" x="180.0" y="87" text-anchor="middle"><tspan x="180.0" dy="0">Кровля коллектора</tspan></text><line class="ill-line" x1="180.0" y1="102.0" x2="180.0" y2="126.0"/><polygon class="ill-arrow" points="180.0,126.0 176.1,117.9 183.9,117.9"/><rect class="ill-box ill-good" x="12.0" y="130" width="336" height="56" rx="10"/><text class="ill-text" x="180.0" y="154" text-anchor="middle"><tspan x="180.0" dy="0">Зона предельного нефтенасыщения</tspan><tspan x="180.0" dy="19">(высокое сопротивление)</tspan></text><line class="ill-line" x1="180.0" y1="188.0" x2="180.0" y2="212.0"/><polygon class="ill-arrow" points="180.0,212.0 176.1,203.9 183.9,203.9"/><rect class="ill-box ill-accent" x="12.0" y="216" width="336" height="56" rx="10"/><text class="ill-text" x="180.0" y="240" text-anchor="middle"><tspan x="180.0" dy="0">Переходная зона: сопротивление</tspan><tspan x="180.0" dy="19">падает с глубиной</tspan></text><line class="ill-line" x1="180.0" y1="274.0" x2="180.0" y2="298.0"/><polygon class="ill-arrow" points="180.0,298.0 176.1,289.9 183.9,289.9"/><rect class="ill-box ill-accent" x="12.0" y="302" width="336" height="56" rx="10"/><text class="ill-text" x="180.0" y="326" text-anchor="middle"><tspan x="180.0" dy="0">ВНК — где сопротивление равно</tspan><tspan x="180.0" dy="19">критическому</tspan></text><line class="ill-line" x1="180.0" y1="360.0" x2="180.0" y2="384.0"/><polygon class="ill-arrow" points="180.0,384.0 176.1,375.9 183.9,375.9"/><rect class="ill-box ill-bad" x="12.0" y="388" width="336" height="56" rx="10"/><text class="ill-text" x="180.0" y="412" text-anchor="middle"><tspan x="180.0" dy="0">Зеркало воды, ниже — водоносный</tspan><tspan x="180.0" dy="19">коллектор</tspan></text><text class="ill-label" x="350" y="16" text-anchor="end">схема</text></svg>