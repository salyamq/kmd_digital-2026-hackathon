<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" role="img" aria-label="Параметр насыщения: сравнение, а не одно число" class="ill-svg"><title>Параметр насыщения: сравнение, а не одно число</title><style>
.ill-bg{fill:var(--ill-bg,#fff)} .ill-box{fill:var(--ill-box,#f3f5f8);stroke:var(--ill-line,#5b6573);stroke-width:1.5}
.ill-good{fill:var(--ill-good,#d9efe1);stroke:var(--ill-good-line,#2f7d4f)} .ill-bad{fill:var(--ill-bad,#f8dcd8);stroke:var(--ill-bad-line,#b5473a)}
.ill-neutral{fill:var(--ill-neutral,#e6e9ef);stroke:var(--ill-line,#5b6573)} .ill-accent{fill:var(--ill-accent,#dce8f8);stroke:var(--ill-accent-line,#2f5f9e)}
.ill-line{stroke:var(--ill-line,#5b6573);stroke-width:1.5;fill:none} .ill-arrow{fill:var(--ill-line,#5b6573)}
.ill-text{fill:var(--ill-text,#1d2330);font:15px system-ui,sans-serif} .ill-small{fill:var(--ill-muted,#5b6573);font:13px system-ui,sans-serif}
.ill-title{fill:var(--ill-text,#1d2330);font:600 16px system-ui,sans-serif} .ill-label{fill:var(--ill-muted,#5b6573);font:italic 12px system-ui,sans-serif}
.ill-point{fill:var(--ill-accent-line,#2f5f9e)}
</style><rect class="ill-bg" x="0" y="0" width="360" height="420" rx="8"/><text class="ill-title" x="180.0" y="38" text-anchor="middle"><tspan x="180.0" dy="0">Параметр насыщения: сравнение, а</tspan><tspan x="180.0" dy="19">не одно число</tspan></text><text class="ill-small" x="14" y="86">Признаки</text><rect class="ill-box ill-accent" x="12" y="94" width="336" height="52" rx="8"/><text class="ill-text" x="24" y="115" text-anchor="start"><tspan x="24" dy="0">Сопротивление пласта — методы</tspan><tspan x="24" dy="19">сопротивления</tspan></text><rect class="ill-box ill-accent" x="12" y="152" width="336" height="71" rx="8"/><text class="ill-text" x="24" y="173" text-anchor="start"><tspan x="24" dy="0">Сопротивление того же пласта с водой —</tspan><tspan x="24" dy="19">методы пористости и сопротивление</tspan><tspan x="24" dy="19">пластовой воды</tspan></text><line class="ill-line" x1="180.0" y1="231.0" x2="180.0" y2="251.0"/><polygon class="ill-arrow" points="180.0,251.0 176.1,242.9 183.9,242.9"/><text class="ill-small" x="14" y="263">Правило</text><rect class="ill-box ill-neutral" x="12" y="271" width="336" height="52" rx="8"/><text class="ill-text" x="24" y="292" text-anchor="start"><tspan x="24" dy="0">Pн = сопротивление пласта /</tspan><tspan x="24" dy="19">сопротивление пласта с водой</tspan></text><line class="ill-line" x1="180.0" y1="329.0" x2="180.0" y2="349.0"/><polygon class="ill-arrow" points="180.0,349.0 176.1,340.9 183.9,340.9"/><text class="ill-small" x="14" y="361">Вывод</text><rect class="ill-box ill-good" x="12" y="369" width="336" height="33" rx="8"/><text class="ill-text" x="24" y="390" text-anchor="start"><tspan x="24" dy="0">Pн &gt; 1 → в порах есть нефть или газ</tspan></text><text class="ill-label" x="350" y="16" text-anchor="end">схема</text></svg>