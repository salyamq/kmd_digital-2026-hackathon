</style><rect class="ill-bg" x="0" y="0" width="360" height="460" rx="8"/><text class="ill-title" x="180.0" y="38" text-anchor="middle"><tspan x="180.0" dy="0">МБК против БК-3: какое</tspan><tspan x="180.0" dy="19">проникновение</tspan></text><text class="ill-small" x="14" y="86">Признаки</text><rect class="ill-box ill-accent" x="12" y="94" width="336" height="33" rx="8"/><text class="ill-text" x="24" y="115" text-anchor="start"><tspan x="24" dy="0">Показания МБК (прискважинная зона)</tspan></text><rect class="ill-box ill-accent" x="12" y="133" width="336" height="33" rx="8"/><text class="ill-text" x="24" y="154" text-anchor="start"><tspan x="24" dy="0">Показания БК-3 (глубже в пласт)</tspan></text><line class="ill-line" x1="180.0" y1="174.0" x2="180.0" y2="194.0"/><polygon class="ill-arrow" points="180.0,194.0 176.1,185.9 183.9,185.9"/><text class="ill-small" x="14" y="206">Правило</text><rect class="ill-box ill-neutral" x="12" y="214" width="336" height="52" rx="8"/><text class="ill-text" x="24" y="235" text-anchor="start"><tspan x="24" dy="0">Сравнить показания двух экранированных</tspan><tspan x="24" dy="19">зондов</tspan></text><line class="ill-line" x1="180.0" y1="272.0" x2="180.0" y2="292.0"/><polygon class="ill-arrow" points="180.0,292.0 176.1,283.9 183.9,283.9"/><text class="ill-small" x="14" y="304">Вывод</text><rect class="ill-box ill-accent" x="12" y="312" width="336" height="33" rx="8"/><text class="ill-text" x="24" y="333" text-anchor="start"><tspan x="24" dy="0">МБК &gt; БК → повышающее проникновение</tspan></text><rect class="ill-box ill-good" x="12" y="351" width="336" height="33" rx="8"/><text class="ill-text" x="24" y="372" text-anchor="start"><tspan x="24" dy="0">МБК &lt; БК → понижающее проникновение</tspan></text><rect class="ill-box ill-neutral" x="12" y="390" width="336" height="52" rx="8"/><text class="ill-text" x="24" y="411" text-anchor="start"><tspan x="24" dy="0">разницы нет → коллектор не исключён:</tspan><tspan x="24" dy="19">нужны динамические методы</tspan></text><text class="ill-label" x="350" y="16" text-anchor="end">схема</text></svg>