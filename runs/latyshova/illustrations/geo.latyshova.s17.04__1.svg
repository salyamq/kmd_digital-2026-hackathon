<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 459" role="img" aria-label="Пресный и солёный фильтрат: кто выигрывает" class="ill-svg"><title>Пресный и солёный фильтрат: кто выигрывает</title><style>
.ill-bg{fill:var(--ill-bg,#fff)} .ill-box{fill:var(--ill-box,#f3f5f8);stroke:var(--ill-line,#5b6573);stroke-width:1.5}
.ill-good{fill:var(--ill-good,#d9efe1);stroke:var(--ill-good-line,#2f7d4f)} .ill-bad{fill:var(--ill-bad,#f8dcd8);stroke:var(--ill-bad-line,#b5473a)}
.ill-neutral{fill:var(--ill-neutral,#e6e9ef);stroke:var(--ill-line,#5b6573)} .ill-accent{fill:var(--ill-accent,#dce8f8);stroke:var(--ill-accent-line,#2f5f9e)}
.ill-line{stroke:var(--ill-line,#5b6573);stroke-width:1.5;fill:none} .ill-arrow{fill:var(--ill-line,#5b6573)}
.ill-text{fill:var(--ill-text,#1d2330);font:15px system-ui,sans-serif} .ill-small{fill:var(--ill-muted,#5b6573);font:13px system-ui,sans-serif}
.ill-title{fill:var(--ill-text,#1d2330);font:600 16px system-ui,sans-serif} .ill-label{fill:var(--ill-muted,#5b6573);font:italic 12px system-ui,sans-serif}
.ill-point{fill:var(--ill-accent-line,#2f5f9e)}
</style><rect class="ill-bg" x="0" y="0" width="360" height="459" rx="8"/><text class="ill-title" x="180.0" y="38" text-anchor="middle"><tspan x="180.0" dy="0">Пресный и солёный фильтрат: кто</tspan><tspan x="180.0" dy="19">выигрывает</tspan></text><rect class="ill-box ill-good" x="12" y="82" width="336" height="122" rx="10"/><text class="ill-title" x="180.0" y="106" text-anchor="middle"><tspan x="180.0" dy="0">Пресный фильтрат</tspan></text><text class="ill-text" x="26" y="131" text-anchor="start"><tspan x="26" dy="0">• коллектор: отрицательная аномалия СП</tspan></text><text class="ill-text" x="26" y="154" text-anchor="start"><tspan x="26" dy="0">• коллектор: приращение на микрозондах</tspan></text><text class="ill-text" x="26" y="177" text-anchor="start"><tspan x="26" dy="0">• это самый частый случай</tspan></text><rect class="ill-box ill-accent" x="12" y="214" width="336" height="179" rx="10"/><text class="ill-title" x="180.0" y="238" text-anchor="middle"><tspan x="180.0" dy="0">Фильтрат близок к пластовой воде</tspan></text><text class="ill-text" x="26" y="263" text-anchor="start"><tspan x="26" dy="0">• СП и микрозонды почти не выделяют</tspan><tspan x="26" dy="19">коллектор</tspan></text><text class="ill-text" x="26" y="305" text-anchor="start"><tspan x="26" dy="0">• индукционный метод хуже изучает</tspan><tspan x="26" dy="19">разрез</tspan></text><text class="ill-text" x="26" y="347" text-anchor="start"><tspan x="26" dy="0">• продуктивность легче оценить</tspan><tspan x="26" dy="19">разноглубинной электрометрией</tspan></text><text class="ill-small" x="180.0" y="415" text-anchor="middle"><tspan x="180.0" dy="0">Одно и то же условие помогает одним</tspan><tspan x="180.0" dy="19">методам и мешает другим</tspan></text><text class="ill-label" x="350" y="16" text-anchor="end">схема</text></svg>