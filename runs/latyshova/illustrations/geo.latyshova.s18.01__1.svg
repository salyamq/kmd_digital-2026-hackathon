<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 412" role="img" aria-label="Как классифицируют коллекторы" class="ill-svg"><title>Как классифицируют коллекторы</title><style>
.ill-bg{fill:var(--ill-bg,#fff)} .ill-box{fill:var(--ill-box,#f3f5f8);stroke:var(--ill-line,#5b6573);stroke-width:1.5}
.ill-good{fill:var(--ill-good,#d9efe1);stroke:var(--ill-good-line,#2f7d4f)} .ill-bad{fill:var(--ill-bad,#f8dcd8);stroke:var(--ill-bad-line,#b5473a)}
.ill-neutral{fill:var(--ill-neutral,#e6e9ef);stroke:var(--ill-line,#5b6573)} .ill-accent{fill:var(--ill-accent,#dce8f8);stroke:var(--ill-accent-line,#2f5f9e)}
.ill-line{stroke:var(--ill-line,#5b6573);stroke-width:1.5;fill:none} .ill-arrow{fill:var(--ill-line,#5b6573)}
.ill-text{fill:var(--ill-text,#1d2330);font:15px system-ui,sans-serif} .ill-small{fill:var(--ill-muted,#5b6573);font:13px system-ui,sans-serif}
.ill-title{fill:var(--ill-text,#1d2330);font:600 16px system-ui,sans-serif} .ill-label{fill:var(--ill-muted,#5b6573);font:italic 12px system-ui,sans-serif}
.ill-point{fill:var(--ill-accent-line,#2f5f9e)}
</style><rect class="ill-bg" x="0" y="0" width="360" height="412" rx="8"/><text class="ill-title" x="180.0" y="38" text-anchor="middle"><tspan x="180.0" dy="0">Как классифицируют коллекторы</tspan></text><rect class="ill-box ill-accent" x="12.0" y="63" width="336" height="75" rx="10"/><text class="ill-text" x="180.0" y="87" text-anchor="middle"><tspan x="180.0" dy="0">По форме пустот: межзерновые,</tspan><tspan x="180.0" dy="19">трещинные, кавернозно-трещинные,</tspan><tspan x="180.0" dy="19">смешанные</tspan></text><line class="ill-line" x1="180.0" y1="140.0" x2="180.0" y2="164.0"/><polygon class="ill-arrow" points="180.0,164.0 176.1,155.9 183.9,155.9"/><rect class="ill-box ill-neutral" x="12.0" y="168" width="336" height="56" rx="10"/><text class="ill-text" x="180.0" y="192" text-anchor="middle"><tspan x="180.0" dy="0">Терригенные межзерновые: высоко- и</tspan><tspan x="180.0" dy="19">низкопористые, чистые и глинистые</tspan></text><line class="ill-line" x1="180.0" y1="226.0" x2="180.0" y2="250.0"/><polygon class="ill-arrow" points="180.0,250.0 176.1,241.9 183.9,241.9"/><rect class="ill-box ill-neutral" x="12.0" y="254" width="336" height="56" rx="10"/><text class="ill-text" x="180.0" y="278" text-anchor="middle"><tspan x="180.0" dy="0">Глинистые: глина рассеянная,</tspan><tspan x="180.0" dy="19">слоистая или гнездовидная</tspan></text><line class="ill-line" x1="180.0" y1="312.0" x2="180.0" y2="336.0"/><polygon class="ill-arrow" points="180.0,336.0 176.1,327.9 183.9,327.9"/><rect class="ill-box ill-neutral" x="12.0" y="340" width="336" height="56" rx="10"/><text class="ill-text" x="180.0" y="364" text-anchor="middle"><tspan x="180.0" dy="0">Карбонатные высокопористые: часто</tspan><tspan x="180.0" dy="19">смешанные, со вторичными порами</tspan></text><text class="ill-label" x="350" y="16" text-anchor="end">схема</text></svg>