<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 524" role="img" aria-label="Два «неудобных» раствора" class="ill-svg"><title>Два «неудобных» раствора</title><style>
.ill-bg{fill:var(--ill-bg,#fff)} .ill-box{fill:var(--ill-box,#f3f5f8);stroke:var(--ill-line,#5b6573);stroke-width:1.5}
.ill-good{fill:var(--ill-good,#d9efe1);stroke:var(--ill-good-line,#2f7d4f)} .ill-bad{fill:var(--ill-bad,#f8dcd8);stroke:var(--ill-bad-line,#b5473a)}
.ill-neutral{fill:var(--ill-neutral,#e6e9ef);stroke:var(--ill-line,#5b6573)} .ill-accent{fill:var(--ill-accent,#dce8f8);stroke:var(--ill-accent-line,#2f5f9e)}
.ill-line{stroke:var(--ill-line,#5b6573);stroke-width:1.5;fill:none} .ill-arrow{fill:var(--ill-line,#5b6573)}
.ill-text{fill:var(--ill-text,#1d2330);font:15px system-ui,sans-serif} .ill-small{fill:var(--ill-muted,#5b6573);font:13px system-ui,sans-serif}
.ill-title{fill:var(--ill-text,#1d2330);font:600 16px system-ui,sans-serif} .ill-label{fill:var(--ill-muted,#5b6573);font:italic 12px system-ui,sans-serif}
.ill-point{fill:var(--ill-accent-line,#2f5f9e)}
</style><rect class="ill-bg" x="0" y="0" width="360" height="524" rx="8"/><text class="ill-title" x="180.0" y="38" text-anchor="middle"><tspan x="180.0" dy="0">Два «неудобных» раствора</tspan></text><rect class="ill-box ill-bad" x="12" y="63" width="336" height="202" rx="10"/><text class="ill-title" x="180.0" y="87" text-anchor="middle"><tspan x="180.0" dy="0">Техническая вода (в разрезе есть</tspan><tspan x="180.0" dy="19">глины)</tspan></text><text class="ill-text" x="26" y="131" text-anchor="start"><tspan x="26" dy="0">• очень высокая водоотдача</tspan></text><text class="ill-text" x="26" y="154" text-anchor="start"><tspan x="26" dy="0">• глубокое проникновение</tspan></text><text class="ill-text" x="26" y="177" text-anchor="start"><tspan x="26" dy="0">• насыщение по ГИС, как правило, не</tspan><tspan x="26" dy="19">оценить</tspan></text><text class="ill-text" x="26" y="219" text-anchor="start"><tspan x="26" dy="0">• микрозонды и каверномер почти не</tspan><tspan x="26" dy="19">выделяют коллектор</tspan></text><rect class="ill-box ill-accent" x="12" y="275" width="336" height="202" rx="10"/><text class="ill-title" x="180.0" y="299" text-anchor="middle"><tspan x="180.0" dy="0">Нефильтрующийся раствор (ИБР,</tspan><tspan x="180.0" dy="19">ВИЭР)</tspan></text><text class="ill-text" x="26" y="343" text-anchor="start"><tspan x="26" dy="0">• огромное сопротивление, нет</tspan><tspan x="26" dy="19">проникновения</tspan></text><text class="ill-text" x="26" y="385" text-anchor="start"><tspan x="26" dy="0">• нет корки и контактной электрометрии</tspan></text><text class="ill-text" x="26" y="408" text-anchor="start"><tspan x="26" dy="0">• работает индукционный зонд</tspan></text><text class="ill-text" x="26" y="431" text-anchor="start"><tspan x="26" dy="0">• насыщение удобно изучать ядерными и</tspan><tspan x="26" dy="19">акустическими методами</tspan></text><text class="ill-small" x="180.0" y="499" text-anchor="middle"><tspan x="180.0" dy="0">Каждый раствор — свой компромисс</tspan></text><text class="ill-label" x="350" y="16" text-anchor="end">схема</text></svg>