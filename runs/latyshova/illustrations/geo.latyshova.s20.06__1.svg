</style><rect class="ill-bg" x="0" y="0" width="360" height="401" rx="8"/><text class="ill-title" x="180.0" y="38" text-anchor="middle"><tspan x="180.0" dy="0">Три способа — одна проверка</tspan></text><text class="ill-small" x="14" y="67">Признаки</text><rect class="ill-box ill-accent" x="12" y="75" width="336" height="33" rx="8"/><text class="ill-text" x="24" y="96" text-anchor="start"><tspan x="24" dy="0">Сопротивление пласта</tspan></text><rect class="ill-box ill-accent" x="12" y="114" width="336" height="52" rx="8"/><text class="ill-text" x="24" y="135" text-anchor="start"><tspan x="24" dy="0">Пористость или показание метода</tspan><tspan x="24" dy="19">пористости</tspan></text><line class="ill-line" x1="180.0" y1="174.0" x2="180.0" y2="194.0"/><polygon class="ill-arrow" points="180.0,194.0 176.1,185.9 183.9,185.9"/><text class="ill-small" x="14" y="206">Правило</text><rect class="ill-box ill-neutral" x="12" y="214" width="336" height="71" rx="8"/><text class="ill-text" x="24" y="235" text-anchor="start"><tspan x="24" dy="0">Сравнить сопротивление пласта с</tspan><tspan x="24" dy="19">сопротивлением водонасыщенного пласта</tspan><tspan x="24" dy="19">той же пористости</tspan></text><line class="ill-line" x1="180.0" y1="291.0" x2="180.0" y2="311.0"/><polygon class="ill-arrow" points="180.0,311.0 176.1,302.9 183.9,302.9"/><text class="ill-small" x="14" y="323">Вывод</text><rect class="ill-box ill-good" x="12" y="331" width="336" height="52" rx="8"/><text class="ill-text" x="24" y="352" text-anchor="start"><tspan x="24" dy="0">сопротивление выше «водного» → Pн &gt; 1:</tspan><tspan x="24" dy="19">нефть или газ</tspan></text><text class="ill-label" x="350" y="16" text-anchor="end">схема</text></svg>