   <g id="text_2">
    <text style="font-size: 8.892px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(53.385204 65.684737)">Ствол уже</text>
    <text style="font-size: 8.892px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(46.438329 76.406543)">номинала: на</text>
    <text style="font-size: 8.892px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(61.950007 87.076943)">стенке</text>
    <text style="font-size: 8.892px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(53.751305 97.747343)">глинистая</text>
    <text style="font-size: 8.892px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(64.4092 107.556331)">корка</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 5.8032px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1565c0" x="139.8348" y="56.959352" transform="rotate(-0 139.8348 56.959352)">НАБЛЮДЕНИЕ</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.892px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(152.774918 70.961583)">Микрозонды</text>
    <text style="font-size: 8.892px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(145.471669 80.880331)">расходятся при</text>
    <text style="font-size: 8.892px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(157.159786 92.412143)">невысоких</text>
    <text style="font-size: 8.892px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(155.076418 103.085322)">показаниях</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 5.8032px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1565c0" x="244.0908" y="56.959352" transform="rotate(-0 244.0908 56.959352)">НАБЛЮДЕНИЕ</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.892px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(266.455744 71.959154)">Малый и</text>
    <text style="font-size: 8.892px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(249.96942 82.155083)">большой зонды</text>
    <text style="font-size: 8.892px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(257.970831 92.414922)">показывают</text>
    <text style="font-size: 8.892px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(270.286251 102.22391)">разное</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 5.8032px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6d4c41" x="139.8348" y="146.786732" transform="rotate(-0 139.8348 146.786732)">ДОПУЩЕНИЕ</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.892px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(163.700963 158.668383)">Раствор</text>
    <text style="font-size: 8.892px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(155.59396 169.882723)">глинистый,</text>
    <text style="font-size: 8.892px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(156.818 180.145342)">пресный, с</text>
    <text style="font-size: 8.892px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(167.773916 191.677154)">малой</text>
    <text style="font-size: 8.892px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(151.808608 201.796667)">водоотдачей</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 5.8032px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2e7d32" x="139.8348" y="243.043352" transform="rotate(-0 139.8348 243.043352)">ВЫВОД</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8.892px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(164.898605 257.045583)">Порода</text>
    <text style="font-size: 8.892px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(155.136161 266.964331)">пропускает</text>
    <text style="font-size: 8.892px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(148.763098 278.386383)">фильтрат: это</text>
    <text style="font-size: 8.892px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(157.659961 288.305131)">коллектор</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 5.8032px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #c62828" x="139.8348" y="332.870732" transform="rotate(-0 139.8348 332.870732)">ИНАЧЕ</text>
   </g>
   <g id="text_12">
