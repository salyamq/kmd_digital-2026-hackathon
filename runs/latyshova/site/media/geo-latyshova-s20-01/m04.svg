    <text style="font-size: 8.892px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(145.919742 354.671131)">проникновения</text>
    <text style="font-size: 8.892px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(159.730824 366.531531)">— ещё не</text>
    <text style="font-size: 8.892px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(166.203228 376.876122)">значит</text>
    <text style="font-size: 8.892px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(152.017709 386.682331)">неколлектор</text>
