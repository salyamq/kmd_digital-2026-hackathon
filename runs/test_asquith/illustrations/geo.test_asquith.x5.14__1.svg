<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 285" role="img" aria-label="Толстая кривая / Тонкая гипербола" class="ill-svg"><title>Толстая кривая / Тонкая гипербола</title><style>
.ill-bg{fill:var(--ill-bg,#fff)} .ill-box{fill:var(--ill-box,#f3f5f8);stroke:var(--ill-line,#5b6573);stroke-width:1.5}
.ill-good{fill:var(--ill-good,#d9efe1);stroke:var(--ill-good-line,#2f7d4f)} .ill-bad{fill:var(--ill-bad,#f8dcd8);stroke:var(--ill-bad-line,#b5473a)}
.ill-neutral{fill:var(--ill-neutral,#e6e9ef);stroke:var(--ill-line,#5b6573)} .ill-accent{fill:var(--ill-accent,#dce8f8);stroke:var(--ill-accent-line,#2f5f9e)}
.ill-line{stroke:var(--ill-line,#5b6573);stroke-width:1.5;fill:none} .ill-arrow{fill:var(--ill-line,#5b6573)}
.ill-text{fill:var(--ill-text,#1d2330);font:15px system-ui,sans-serif} .ill-small{fill:var(--ill-muted,#5b6573);font:13px system-ui,sans-serif}
.ill-title{fill:var(--ill-text,#1d2330);font:600 16px system-ui,sans-serif} .ill-label{fill:var(--ill-muted,#5b6573);font:italic 12px system-ui,sans-serif}
.ill-point{fill:var(--ill-accent-line,#2f5f9e)}
</style><rect class="ill-bg" x="0" y="0" width="360" height="285" rx="8"/><rect class="ill-box ill-neutral" x="12" y="30" width="336" height="99" rx="10"/><text class="ill-title" x="180.0" y="54" text-anchor="middle"><tspan x="180.0" dy="0">Толстая кривая</tspan></text><text class="ill-text" x="26" y="79" text-anchor="start"><tspan x="26" dy="0">• Проницаемость</tspan></text><text class="ill-text" x="26" y="102" text-anchor="start"><tspan x="26" dy="0">• В примере 130 мД</tspan></text><rect class="ill-box ill-accent" x="12" y="139" width="336" height="99" rx="10"/><text class="ill-title" x="180.0" y="163" text-anchor="middle"><tspan x="180.0" dy="0">Тонкая гипербола</tspan></text><text class="ill-text" x="26" y="188" text-anchor="start"><tspan x="26" dy="0">• Объёмное содержание воды</tspan></text><text class="ill-text" x="26" y="211" text-anchor="start"><tspan x="26" dy="0">• В примере 0,10</tspan></text><text class="ill-small" x="180.0" y="260" text-anchor="middle"><tspan x="180.0" dy="0">Оба значения относятся к одной точке</tspan></text><text class="ill-label" x="350" y="16" text-anchor="end">схема</text></svg>