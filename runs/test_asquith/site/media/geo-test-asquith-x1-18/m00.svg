   <g id="text_1">
    <text style="font-weight: 700; font-size: 5.8032px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1565c0" x="127.5372" y="50.746832" transform="rotate(-0 127.5372 50.746832)">НАБЛЮДЕНИЕ</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6.3648px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(138.731359 60.566569)">Для сопоставимых интервалов</text>
    <text style="font-size: 6.3648px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(158.383177 68.284883)">возьмите истинное</text>
    <text style="font-size: 6.3648px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(141.993319 75.304064)">сопротивление и пористость</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 5.8032px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ad1457" x="127.5372" y="114.215321" transform="rotate(-0 127.5372 114.215321)">ДЕЙСТВИЕ</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6.3648px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(139.687571 123.16003)">Рассчитайте форм-фактор F =</text>
    <text style="font-size: 6.3648px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(133.82201 130.700329)">a/φᵐ и кажущееся сопротивление</text>
    <text style="font-size: 6.3648px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(163.509824 138.560359)">воды Rwa = Rt/F</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 5.8032px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #37474f" x="53.6292" y="179.875952" transform="rotate(-0 53.6292 179.875952)">ПРИЧИНА</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.3648px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(66.633847 189.377449)">В водоносном интервале Rt =</text>
    <text style="font-size: 6.3648px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(79.786607 197.015209)">Ro, поэтому Rwa = Rw</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 5.8032px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #e65100" x="201.4452" y="175.738832" transform="rotate(-0 201.4452 175.738832)">СЛЕДСТВИЕ</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.3648px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(216.784933 185.558569)">Присутствие углеводородов</text>
    <text style="font-size: 6.3648px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(207.957254 193.812919)">повышает Rt и Rwa относительно</text>
    <text style="font-size: 6.3648px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(236.771399 200.296064)">водяного случая</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 5.8032px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ad1457" x="127.5372" y="244.947305" transform="rotate(-0 127.5372 244.947305)">ДЕЙСТВИЕ</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6.3648px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="190.872" y="255.78979" transform="rotate(-0 190.872 255.78979)">Найдите минимум Rwa</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 5.8032px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6d4c41" x="127.5372" y="304.867952" transform="rotate(-0 127.5372 304.867952)">ДОПУЩЕНИЕ</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6.3648px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(132.27059 314.46691)">Опорный интервал действительно</text>
    <text style="font-size: 6.3648px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(168.773713 322.32694)">водоносный?</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 5.8032px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2e7d32" x="53.6292" y="367.363952" transform="rotate(-0 53.6292 367.363952)">ВЫВОД</text>
   </g>
   <g id="text_14">
    <text style="font-size: 6.3648px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(67.744703 376.865449)">Если да, минимум оценивает</text>
    <text style="font-size: 6.3648px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(63.257022 384.60067)">сопротивление пластовой воды</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 5.8032px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #c62828" x="201.4452" y="363.226832" transform="rotate(-0 201.4452 363.226832)">ИНАЧЕ</text>
   </g>
   <g id="text_16">
    <text style="font-size: 6.3648px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(214.572668 373.138063)">Если нет, минимум смещён: в</text>
    <text style="font-size: 6.3648px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(209.806526 380.148293)">остальных зонах углеводородов</text>
    <text style="font-size: 6.3648px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(215.316056 388.474247)">больше, чем предполагалось</text>
   </g>
