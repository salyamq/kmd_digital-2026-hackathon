   <g id="text_1">
    <text style="font-weight: 700; font-size: 6.438462px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1565c0" x="284.760692" y="55.932106" transform="rotate(-0 284.760692 55.932106)">НАБЛЮДЕНИЕ</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.865385px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(323.017396 72.601645)">Для сопоставимых интервалов возьмите истинное</text>
    <text style="font-size: 9.865385px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(379.998471 83.606173)">сопротивление и пористость</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 6.438462px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ad1457" x="284.760692" y="127.211052" transform="rotate(-0 284.760692 127.211052)">ДЕЙСТВИЕ</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.865385px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(327.741991 142.952709)">Рассчитайте форм-фактор F = a/φᵐ и кажущееся</text>
    <text style="font-size: 9.865385px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(372.036797 154.640107)">сопротивление воды Rwa = Rt/F</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 6.438462px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #37474f" x="89.280692" y="202.744606" transform="rotate(-0 89.280692 202.744606)">ПРИЧИНА</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.865385px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="260.28" y="218.920876" transform="rotate(-0 260.28 218.920876)">В водоносном интервале Rt = Ro, поэтому Rwa = Rw</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 6.438462px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #e65100" x="480.240692" y="196.332106" transform="rotate(-0 480.240692 196.332106)">СЛЕДСТВИЕ</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.865385px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(525.037067 213.001645)">Присутствие углеводородов повышает Rt и Rwa</text>
    <text style="font-size: 9.865385px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(569.995475 224.006173)">относительно водяного случая</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 6.438462px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ad1457" x="284.760692" y="274.023552" transform="rotate(-0 284.760692 274.023552)">ДЕЙСТВИЕ</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9.865385px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="455.76" y="289.27194" transform="rotate(-0 455.76 289.27194)">Найдите минимум Rwa</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 6.438462px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6d4c41" x="284.760692" y="343.144606" transform="rotate(-0 284.760692 343.144606)">ДОПУЩЕНИЕ</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9.865385px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="455.76" y="359.47194" transform="rotate(-0 455.76 359.47194)">Опорный интервал действительно водоносный?</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 6.438462px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2e7d32" x="89.280692" y="406.932106" transform="rotate(-0 89.280692 406.932106)">ВЫВОД</text>
   </g>
   <g id="text_14">
    <text style="font-size: 9.865385px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(113.975575 423.752709)">Если да, минимум оценивает сопротивление пластовой</text>
    <text style="font-size: 9.865385px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(247.049594 434.950691)">воды</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 6.438462px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #c62828" x="480.240692" y="406.932106" transform="rotate(-0 480.240692 406.932106)">ИНАЧЕ</text>
   </g>
   <g id="text_16">
    <text style="font-size: 9.865385px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(527.750048 423.74346)">Если нет, минимум смещён: в остальных зонах</text>
    <text style="font-size: 9.865385px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(533.464264 435.675951)">углеводородов больше, чем предполагалось</text>
   </g>
