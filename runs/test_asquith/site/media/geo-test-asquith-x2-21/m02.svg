   <g id="text_12">
    <text style="font-size: 7.1136px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(145.312726 311.004236)">Глина песчаника может</text>
    <text style="font-size: 7.1136px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(151.398189 318.939235)">отличаться от глины</text>
    <text style="font-size: 7.1136px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(156.824532 327.034845)">соседних сланцев</text>
