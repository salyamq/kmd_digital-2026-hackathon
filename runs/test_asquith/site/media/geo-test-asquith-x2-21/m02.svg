   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 5.8032px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #37474f" x="127.9116" y="111.333392" transform="rotate(-0 127.9116 111.333392)">ПРИЧИНА</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.1136px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(140.866171 122.827106)">Арчи ограничен в породах</text>
    <text style="font-size: 7.1136px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(139.78746 131.010525)">со сланцами и глинистыми</text>
    <text style="font-size: 7.1136px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(167.478259 139.298425)">минералами</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 5.8032px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1565c0" x="127.9116" y="173.829392" transform="rotate(-0 127.9116 173.829392)">НАБЛЮДЕНИЕ</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.1136px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(146.469242 186.012236)">В глинистом песчанике</text>
    <text style="font-size: 7.1136px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(137.211003 193.258105)">глина — компонент породы,</text>
    <text style="font-size: 7.1136px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(154.826055 201.794425)">а сланец — порода</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 5.8032px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ad1457" x="54.0036" y="237.297881" transform="rotate(-0 54.0036 237.297881)">ДЕЙСТВИЕ</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.1136px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(78.199326 248.176454)">Семейство моделей:</text>
    <text style="font-size: 7.1136px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(59.97017 256.525486)">использовать объёмную долю</text>
    <text style="font-size: 7.1136px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(103.629334 264.538845)">сланца</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 5.8032px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ad1457" x="201.8196" y="237.297881" transform="rotate(-0 201.8196 237.297881)">ДЕЙСТВИЕ</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7.1136px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(229.448194 247.928033)">Другое семейство:</text>
    <text style="font-size: 7.1136px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(209.901355 255.756328)">использовать электрические</text>
    <text style="font-size: 7.1136px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(217.867475 265.689803)">свойства глины в пласте</text>
   </g>
   <g id="text_11">
