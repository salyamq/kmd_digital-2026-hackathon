   <g id="text_2">
    <text style="font-size: 7.956px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(101.32722 60.428022)">Сравните незатронутую и промытую зоны</text>
    <text style="font-size: 7.956px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(152.625395 69.25048)">одного интервала</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 5.8032px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6d4c41" x="76.5972" y="100.964672" transform="rotate(-0 76.5972 100.964672)">ДОПУЩЕНИЕ</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.956px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(95.267607 114.134009)">Один и тот же форм-фактор в обеих зонах; n</text>
    <text style="font-size: 7.956px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(129.130954 123.612837)">= 2,0 для квадратной формы</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 5.8032px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ad1457" x="76.5972" y="155.505161" transform="rotate(-0 76.5972 155.505161)">ДЕЙСТВИЕ</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.956px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(91.786857 167.633637)">Разделите уравнение Арчи незатронутой зоны</text>
    <text style="font-size: 7.956px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(128.368297 177.180837)">на уравнение промытой зоны</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 5.8032px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #e65100" x="76.5972" y="213.272072" transform="rotate(-0 76.5972 213.272072)">СЛЕДСТВИЕ</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.956px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="190.872" y="225.975237" transform="rotate(-0 190.872 225.975237)">Одинаковый форм-фактор сокращается</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 5.8032px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ad1457" x="76.5972" y="262.641161" transform="rotate(-0 76.5972 262.641161)">ДЕЙСТВИЕ</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7.956px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(104.605962 275.048097)">Разделите Rxo/Rt на Rmf/Rw и извлеките</text>
    <text style="font-size: 7.956px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(149.30998 284.316837)">квадратный корень</text>
