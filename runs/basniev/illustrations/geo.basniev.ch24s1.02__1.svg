<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 402" role="img" aria-label="Две фазы перераспределения давления" class="ill-svg"><title>Две фазы перераспределения давления</title><style>
.ill-bg{fill:var(--ill-bg,#fff)} .ill-box{fill:var(--ill-box,#f3f5f8);stroke:var(--ill-line,#5b6573);stroke-width:1.5}
.ill-good{fill:var(--ill-good,#d9efe1);stroke:var(--ill-good-line,#2f7d4f)} .ill-bad{fill:var(--ill-bad,#f8dcd8);stroke:var(--ill-bad-line,#b5473a)}
.ill-neutral{fill:var(--ill-neutral,#e6e9ef);stroke:var(--ill-line,#5b6573)} .ill-accent{fill:var(--ill-accent,#dce8f8);stroke:var(--ill-accent-line,#2f5f9e)}
.ill-line{stroke:var(--ill-line,#5b6573);stroke-width:1.5;fill:none} .ill-arrow{fill:var(--ill-line,#5b6573)}
.ill-text{fill:var(--ill-text,#1d2330);font:15px system-ui,sans-serif} .ill-small{fill:var(--ill-muted,#5b6573);font:13px system-ui,sans-serif}
.ill-title{fill:var(--ill-text,#1d2330);font:600 16px system-ui,sans-serif} .ill-label{fill:var(--ill-muted,#5b6573);font:italic 12px system-ui,sans-serif}
.ill-point{fill:var(--ill-accent-line,#2f5f9e)}
</style><rect class="ill-bg" x="0" y="0" width="360" height="402" rx="8"/><text class="ill-title" x="180.0" y="38" text-anchor="middle"><tspan x="180.0" dy="0">Две фазы перераспределения</tspan><tspan x="180.0" dy="19">давления</tspan></text><rect class="ill-box ill-accent" x="12" y="82" width="336" height="122" rx="10"/><text class="ill-title" x="180.0" y="106" text-anchor="middle"><tspan x="180.0" dy="0">Первая фаза</tspan></text><text class="ill-text" x="26" y="131" text-anchor="start"><tspan x="26" dy="0">• Граница возмущения расширяется</tspan></text><text class="ill-text" x="26" y="154" text-anchor="start"><tspan x="26" dy="0">• Вне границы — начальное давление</tspan></text><text class="ill-text" x="26" y="177" text-anchor="start"><tspan x="26" dy="0">• Граница служит контуром питания</tspan></text><rect class="ill-box ill-neutral" x="12" y="214" width="336" height="122" rx="10"/><text class="ill-title" x="180.0" y="238" text-anchor="middle"><tspan x="180.0" dy="0">Вторая фаза</tspan></text><text class="ill-text" x="26" y="263" text-anchor="start"><tspan x="26" dy="0">• Граница дошла до края пласта</tspan></text><text class="ill-text" x="26" y="286" text-anchor="start"><tspan x="26" dy="0">• Начинается после первой фазы</tspan></text><text class="ill-text" x="26" y="309" text-anchor="start"><tspan x="26" dy="0">• В бесконечном пласте её нет</tspan></text><text class="ill-small" x="180.0" y="358" text-anchor="middle"><tspan x="180.0" dy="0">Смена фазы — момент, когда фронт</tspan><tspan x="180.0" dy="19">достигает естественной границы пласта</tspan></text><text class="ill-label" x="350" y="16" text-anchor="end">схема</text></svg>