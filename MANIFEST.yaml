# Манифест конвейера «Глава → курс»: каждый инструмент и модель, версия, уходят ли данные наружу.
# Точные версии Python-пакетов фиксируются в requirements.lock (pip freeze) в теге заморозки.
pipeline_version: see git tag (freeze-*)

models:
  - role: LLM (учебный слой, маршрутизация, страницы шагов, задания, спецификации сцен, сценарии, модуль проверки, доменный пакет)
    used_in_dev_runs: "Claude Opus 5.5 (Anthropic) через очередь запросов kmd/llm.py (provider=queue); ответы закэшированы в runs/<глава>/llm/"
    replaceable_by: "любой Anthropic-модель (ANTHROPIC_API_KEY) или OpenAI-совместимый API: OpenAI, OpenRouter, локальный vLLM/Ollama (OPENAI_API_KEY + OPENAI_BASE_URL); имя модели — KMD_LLM_MODEL"
    how_to_replace: "задать переменные в .env; промпты в prompts/ не зависят от поставщика; каждый ответ валидируется JSON-схемой из schemas/"
    data_leaves: "да — текст главы и промпт уходят провайдеру LLM. Для закрытых данных компании: локальная модель через OPENAI_BASE_URL (vLLM/Ollama) — наружу ничего"
  - role: vision (описания рисунков при разборе главы, оцифровка рисунков книги для перерисовки кодом)
    used_in_dev_runs: "Claude Opus 5.5 (тот же механизм, параметр images= в kmd/llm.py)"
    data_leaves: "да — изображения страниц уходят провайдеру LLM; локальная VLM через OPENAI_BASE_URL — наружу ничего"
    text_only_main_model: "если основная модель без зрения, KMD_LLM_VISION_MODEL задаёт модель для запросов с изображениями; без неё перерисовка рисунков пропускается, рисунки книги остаются как есть"
  - role: "LLM, проверенные API-прогоны (2026-11-25/26)"
    models:
      - "deepseek/deepseek-v4.1-flash-1017 через OpenRouter (рассуждения выключены по умолчанию) — сквозные прогоны Баренблатта; пересборка после правки слоя (~40 с на главу)"
      - "baidu/ernie-5.5-flash-preview:free через OpenRouter (только текст) — сквозные прогоны Латышовой §21, Баренблатта §3, Вендельштейна; слой мельче и с порядком терминов хуже, чем у Claude/DeepSeek"
    settings: "KMD_LLM_PROVIDER=openai, OPENAI_BASE_URL=https://openrouter.ai/api/v1, KMD_LLM_MODEL; KMD_LLM_PARALLEL (по умолчанию 4) — одновременные запросы; KMD_LLM_RETRIES (6) — повторы при сбоях шлюза"
    data_leaves: "да — текст главы уходит в OpenRouter и провайдеру модели"
  - role: "чат по книге (kmd serve, RAG)"
    tool: "поиск по фрагментам главы (BM25, локально) + модель через OpenRouter: baidu/ernie-5.5-flash-preview:free по умолчанию, замена — KMD_CHAT_MODEL; ключ OPENROUTER_API_KEY в .env"
    data_leaves: "да — вопрос и найденные фрагменты главы уходят в OpenRouter; офлайн-курс (file://) чат не показывает и работает без сети"
  - role: синтез речи (основной)
    tool: "edge-tts (онлайн-голоса Microsoft, ru-RU-DmitryNeural)"
    data_leaves: "да — только текст сценария (по ТЗ)"
  - role: сценарий, раскадровка и рендер видео (product)
    tool: "vidpipe из feature/video-pipeline: правила по умолчанию, LLM по --planner llm, Cairo, FFmpeg"
    data_leaves: "нет в режиме правил; при --planner llm текст узла и выдержки страниц получает настроенный провайдер"
  - role: синтез речи (запасной)
    tool: "piper-tts, голос ru_RU-dmitri-medium (локально); espeak-ng (локально)"
    data_leaves: "нет"
  - role: распознавание речи (проверка дорожки)
    tool: "faster-whisper (CPU, int8, локально)"
    data_leaves: "нет"

tools:
  - {name: Python, version: "3.12", data_leaves: no}
  - {name: PyMuPDF, purpose: "рендер страниц PDF", data_leaves: no}
  - {name: jsonschema, purpose: "валидация всех артефактов и ответов LLM", data_leaves: no}
  - {name: Jinja2, purpose: "промпты и HTML курса", data_leaves: no}
  - {name: rapidfuzz, purpose: "поиск дословной цитаты на странице", data_leaves: no}
  - {name: "matplotlib, NumPy, SciPy", purpose: "кадры и иллюстрации классов A/B из моделей состояния", data_leaves: no}
  - {name: ffmpeg, purpose: "сборка роликов, субтитры, громкость −16 LUFS", data_leaves: no}
  - {name: Cairo, purpose: "детерминированный рендер кадров vidpipe", data_leaves: no}
  - {name: pyloudnorm, purpose: "измерение громкости", data_leaves: no}
  - {name: num2words, purpose: "числа словами в сценарии", data_leaves: no}
  - {name: KaTeX, purpose: "формулы в курсе (вложен в сайт, офлайн)", license: MIT, data_leaves: no}

generative_imagery: "не используется: все иллюстрации и кадры курса и роликов — классы A/B, нарисованы кодом"
publication: "главы и ролики не публикуются; репозиторий приватный; курс открывается локально"
